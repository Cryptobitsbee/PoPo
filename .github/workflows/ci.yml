name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and Tauri config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop typecheck
      - run: pnpm --filter desktop build
      - run: pnpm --filter desktop tauri info

  rust-windows:
    name: Rust tests and release check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust with rustfmt
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Check formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Run library tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib
      - name: Check release profile
        run: cargo check --locked --release --manifest-path apps/desktop/src-tauri/Cargo.toml
